# ─────────────────────────────────────────────────────────────
#  "FIND HELP NEAR YOU": the places
#
#  THE RULE: a place only appears on the website when it has a
#  last_verified date. No date, no display. So nothing unchecked
#  can reach a survivor by accident. An NGO also needs its
#  ngo_check lines filled in (see the bottom of this note).
#
#  To verify a place: phone the number or visit, confirm the name,
#  address, phone and hours, then fill in last_verified (YYYY-MM-DD)
#  and verified_how (for example "phoned, spoke to front desk").
#  Re-check every place at least every 6 months.
#
#  NEVER guess an address, a phone number or a map point. If you
#  don't know it, leave it as "".
#
#  The full guide, with a blank entry to copy, is guides/DIRECTORY.md.
#
#  EACH PLACE
#    type      one of the ids under "types" below
#    sector    government | private | ngo
#    district  one of the ids in _data/areas.yml (chandigarh, mohali, panchkula)
#    name, address, phone, hours, notes   what people see. Add name_hi, address_hi,
#              hours_hi, notes_hi for Hindi; without them the English shows.
#    phone2    a second number, if there is one
#    pin       the map point, "latitude, longitude". OPTIONAL. Fill it only after
#              you have checked it on a map. Without it the place still shows,
#              just without a distance.
#    pin_suggested  a map point found online, usually from OpenStreetMap. The real
#              site NEVER uses it. Check it on Google Maps (paste the two numbers
#              into the search box); if it lands on the right building, copy it into pin.
#    needs     OPTIONAL. Leave out to use the type's usual list.
#    todo      a private reminder for you. Never shown on the site.
#    source    where an address or number was found online, and when. Never shown.
#              Finding something online is NOT verifying it: phone before you fill
#              in last_verified.
#    ngo_check ONLY for sector: ngo. All four lines must be filled in:
#                free: true or false
#                works_with_survivors: true
#                spoken_to: "who you or someone you trust spoke to"
#                spoken_on: "2027-01-15"
# ─────────────────────────────────────────────────────────────

# The "What do you need?" buttons, in the order they appear.
needs:
  - id: medical
    label: { en: "Medical care", hi: "इलाज" }
  - id: police
    label: { en: "Police", hi: "पुलिस" }
  - id: legal
    label: { en: "Free legal help", hi: "मुफ़्त कानूनी मदद" }
  - id: support
    label: { en: "Counselling and support", hi: "काउंसलिंग और सहारा" }
  - id: shelter
    label: { en: "A safe place to stay", hi: "रहने की सुरक्षित जगह" }
  - id: child
    label: { en: "Help for a child", hi: "बच्चे के लिए मदद" }

# The kinds of place.
#   needs           which buttons this kind of place answers to
#   whole_district  true = one office serves the whole district, so it is shown only
#                   to people in that district. false = shown to anyone close by.
#   start_here      true = shown first, marked "A good place to start"
#   about           one line shown on every place of this kind (optional)
types:
  - id: one-stop-centre
    label: { en: "One Stop Centre (Sakhi)", hi: "वन स्टॉप सेंटर (सखी)" }
    about:
      en: "For women and girls. Medical, police, legal and counselling help in one place, and a short stay if you need it."
      hi: "महिलाओं और लड़कियों के लिए। इलाज, पुलिस, कानूनी मदद और काउंसलिंग, सब एक ही जगह। ज़रूरत हो तो कुछ दिन रहने की जगह भी।"
    needs: [medical, police, legal, support, shelter]
    whole_district: true
    start_here: true
  - id: hospital
    label: { en: "Hospital", hi: "अस्पताल" }
    needs: [medical]
    whole_district: false
  - id: police
    label: { en: "Police", hi: "पुलिस" }
    needs: [police]
    whole_district: false
  - id: legal-aid
    label: { en: "Legal aid office", hi: "कानूनी सहायता दफ़्तर" }
    about:
      en: "Free lawyers for every woman and every child. They also help with compensation."
      hi: "हर महिला और हर बच्चे के लिए मुफ़्त वकील। मुआवज़े की अर्ज़ी में भी यहाँ मदद मिलती है।"
    needs: [legal]
    whole_district: true
  - id: child-rights
    label: { en: "Child protection", hi: "बाल संरक्षण" }
    needs: [child]
    whole_district: true
  - id: counselling
    label: { en: "Counselling", hi: "काउंसलिंग" }
    needs: [support]
    whole_district: false
  - id: shelter
    label: { en: "Shelter", hi: "आश्रय गृह" }
    needs: [shelter]
    whole_district: false
  - id: support-group
    label: { en: "Support organisation", hi: "सहायता संस्था" }
    needs: [support]
    whole_district: false
  - id: campus
    label: { en: "College or university committee", hi: "कॉलेज या यूनिवर्सिटी की समिति" }
    needs: [support]
    whole_district: false

