# ─────────────────────────────────────────────────────────────
#  HELPLINE NUMBERS: the one place they live.
#  Every page reads its numbers from this file, so a change here
#  changes the whole site.
#
#  show_first: true   → appears in "Need help now?" on every page
#  show_first: false  → appears under "Other helplines", below the main four
#  last_checked       → the date YOU last confirmed the number works (YYYY-MM-DD)
#  hi / pa            → fill in when the Hindi / Punjabi versions are made
# ─────────────────────────────────────────────────────────────

