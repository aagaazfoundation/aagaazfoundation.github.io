# ─────────────────────────────────────────────────────────────
#  THE TOOLKIT: chapter list
#
#  This list drives the "coming soon" page. A chapter goes live
#  the moment a file with the same name exists in the _toolkit folder.
#  Example: add  _toolkit/first-hours.md  and "The first hours"
#  stops saying "Coming soon" and becomes a link. Nothing else to change.
#
#  slug   = the file name (without .md) and the web address
#  mark   = what shows in the small square next to the title
#  colour = the booklet's chapter colour. Kept for reference; the website uses one colour scheme.
# ─────────────────────────────────────────────────────────────

# When the finished PDF is ready, put it in assets/downloads/ and write its
# file name here, for example "aagaaz-toolkit.pdf". The download button then appears.
pdf: ""
pdf_size: ""        # for example "1.1 MB", shown next to the button

chapters:
