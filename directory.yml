# ─────────────────────────────────────────────────────────────
#  "FIND HELP NEAR YOU": the directory (phase 2)
#
#  THE RULE: an entry only appears on the website when it has a
#  last_verified date. No date, no display. So nothing unchecked
#  can reach a survivor by accident.
#
#  To verify an entry: phone the number or visit, confirm the name,
#  address, phone and hours, then fill in last_verified (YYYY-MM-DD)
#  and verified_how (for example "phoned, spoke to front desk").
#  Re-check every entry at least every 6 months.
#
#  NEVER guess an address or a phone number. If you don't know it,
#  leave it as "" and leave last_verified as "".
#
#  type:  one-stop-centre | hospital | legal-aid | police | child-rights | campus
#  city:  chandigarh | panchkula | mohali
#  The entries below come from your booklet draft (Part 8). None has
#  been verified yet, so none will display.
# ─────────────────────────────────────────────────────────────

